# memtree MCP behind Apache (TLS reverse proxy)
# Target: an AWS Linux box; run run_http.sh on 127.0.0.1:8080, apache fronts it.
#   sudo apt install apache2 certbot python3-certbot-apache
#   sudo a2enmod proxy proxy_http ssl headers
#   sudo cp /home/ubuntu/memtree/deploy/apache.conf /etc/apache2/sites-available/memtree.conf
#   sed -i 's/SERVERNAME/your-domain.example/g' /etc/apache2/sites-available/memtree.conf
#   sudo a2ensite memtree
#   sudo certbot --apache -d your-domain.example      # gives Let's Encrypt TLS
#   sudo systemctl reload apache2

<VirtualHost *:80>
    ServerName SERVERNAME
    Redirect permanent / https://SERVERNAME/
</VirtualHost>

<VirtualHost *:443>
    ServerName SERVERNAME
    SSLEngine on
    # certbot writes the SSLCertificateFile lines here after it runs

    # the memtree MCP endpoint (Streamable HTTP)
    ProxyPreserveHost On
    ProxyPass        /mcp      http://127.0.0.1:8080/mcp
    ProxyPassReverse /mcp      http://127.0.0.1:8080/mcp
    <Location /mcp>
        Require all granted
        # keep long-lived SSE streams open
        ProxyTimeout 300
    </Location>

    # health check (keep private-ish, or drop ACLs)
    ProxyPass        /healthz  http://127.0.0.1:8080/healthz
    ProxyPassReverse /healthz  http://127.0.0.1:8080/healthz

    Header always set Access-Control-Allow-Origin "*"
    Header always set Access-Control-Allow-Headers "Content-Type, Mcp-Session-Id, Accept, Authorization"
    Header always set Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS"
</VirtualHost>
