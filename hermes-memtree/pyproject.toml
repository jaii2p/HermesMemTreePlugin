[project]
name = "memtree-mcp"
version = "0.1.0"
description = "Persistent, self-organizing memory for any LLM, served over the Model Context Protocol"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy"]
keywords = ["memory", "mcp", "llm", "agent", "model-context-protocol", "persistent-memory"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
memtree-mcp = "memtree_mcp.server:main"
memtree-mcp-http = "memtree_mcp.http:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["memtree_mcp*"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
